<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 — US 客户信息</title>
    <style>
        :root {
            --navy: #0F2044;
            --gold: #C9A84C;
            --blue: #1D4ED8;
            --red: #B91C1C;
            --green: #15803D;
            --bg: #F1F5F9;
            --white: #FFFFFF;
            --border: #CBD5E1;
            --text: #1E293B;
            --muted: #64748B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ---- 登录页 ---- */
        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--navy);
        }
        .login-box {
            background: var(--white);
            border: 3px solid var(--gold);
            padding: 40px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-box h1 {
            font-size: 18px;
            font-weight: 800;
            color: var(--navy);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .login-box p {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 24px;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            font-size: 15px;
            margin-bottom: 14px;
            outline: none;
            font-family: monospace;
            letter-spacing: 2px;
        }
        .login-box input:focus { border-color: var(--navy); }
        .login-btn {
            width: 100%;
            padding: 13px;
            background: var(--navy);
            color: var(--white);
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .login-btn:hover { background: #1a3a6e; }
        .login-error {
            color: var(--red);
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        /* ---- 主面板 ---- */
        #dashboard { display: none; }

        .top-bar {
            background: var(--navy);
            color: var(--white);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid var(--gold);
        }
        .top-bar h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .live-badge {
            background: var(--green);
            color: var(--white);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .live-dot {
            width: 7px;
            height: 7px;
            background: #86efac;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .logout-btn {
            background: transparent;
            color: #94A3B8;
            border: 1px solid #475569;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .logout-btn:hover { color: var(--white); border-color: var(--white); }

        .dashboard-body { padding: 24px; }

        /* 统计卡片 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-top: 4px solid var(--navy);
            padding: 18px;
        }
        .stat-card .s-num {
            font-size: 28px;
            font-weight: 800;
            color: var(--navy);
            font-family: monospace;
        }
        .stat-card .s-label {
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
            margin-top: 4px;
        }

        /* 控制栏 */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-input {
            padding: 9px 14px;
            border: 1px solid var(--border);
            font-size: 13px;
            outline: none;
            flex: 1;
            min-width: 200px;
        }
        .search-input:focus { border-color: var(--navy); }
        .filter-select {
            padding: 9px 12px;
            border: 1px solid var(--border);
            font-size: 13px;
            outline: none;
            background: var(--white);
            cursor: pointer;
        }
        .refresh-btn {
            padding: 9px 18px;
            background: var(--navy);
            color: var(--white);
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .refresh-btn:hover { background: #1a3a6e; }
        .refresh-btn:active { transform: scale(0.97); }
        .export-btn {
            padding: 9px 18px;
            background: var(--green);
            color: var(--white);
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .export-btn:hover { background: #166534; }

        /* 表格 */
        .table-wrapper {
            background: var(--white);
            border: 1px solid var(--border);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        thead {
            background: var(--navy);
            color: var(--white);
        }
        thead th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 700;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        thead th:hover { background: #1a3a6e; }
        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        tbody tr:hover { background: #F8FAFC; }
        tbody tr.new-row { animation: highlight 2s ease-out; }
        @keyframes highlight {
            0% { background: #FEF9C3; }
            100% { background: transparent; }
        }
        td {
            padding: 11px 14px;
            vertical-align: top;
            max-width: 200px;
        }
        td.truncate {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-yes { background: #DCFCE7; color: #166534; }
        .badge-no { background: #FEE2E2; color: #991B1B; }

        /* 操作按钮 */
        .btn-view {
            padding: 5px 10px;
            background: var(--navy);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            margin-right: 4px;
        }
        .btn-view:hover { background: #1a3a6e; }

        /* 弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--white);
            border: 2px solid var(--navy);
            max-width: 700px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
        }
        .modal-header {
            background: var(--navy);
            color: var(--white);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .modal-header h2 {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .modal-header-btns {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .copy-all-btn {
            background: var(--gold);
            color: var(--navy);
            border: none;
            padding: 7px 16px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.3px;
        }
        .copy-all-btn:hover { background: #b8922e; color: white; }
        .copy-all-btn.copied {
            background: var(--green);
            color: white;
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--white);
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
        }
        .modal-body { padding: 20px; }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }
        @media (max-width: 500px) {
            .detail-grid { grid-template-columns: 1fr; }
        }
        .detail-item label {
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 3px;
        }
        .detail-item .val {
            font-size: 14px;
            color: var(--text);
            word-break: break-word;
        }
        .detail-item.full { grid-column: 1 / -1; }
        .detail-item .val.narrative {
            background: #F8FAFC;
            border: 1px solid var(--border);
            padding: 10px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* 复制成功提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1E293B;
            color: white;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* 空/加载状态 */
        .loading-row td {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #CBD5E1;
            border-top-color: var(--navy);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 分页 */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--muted);
            flex-wrap: wrap;
            gap: 8px;
        }
        .page-btns { display: flex; gap: 6px; }
        .page-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: var(--white);
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .page-btn:hover { background: var(--bg); }
        .page-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

<!-- ==================== 登录页 ==================== -->
<div id="loginScreen">
    <div class="login-box">
        <h1>后台管理入口</h1>
        <p>US 客户信息系统 — 仅限授权人员</p>
        <input type="password" id="adminPassword" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="login-btn" onclick="doLogin()">进入后台</button>
        <div class="login-error" id="loginError">密码错误，拒绝访问。</div>
    </div>
</div>

<!-- ==================== 主面板 ==================== -->
<div id="dashboard">
    <div class="top-bar">
        <h1>■ US 客户信息后台</h1>
        <div class="top-bar-right">
            <span class="live-badge"><span class="live-dot"></span>实时</span>
            <button class="logout-btn" onclick="doLogout()">退出登录</button>
        </div>
    </div>

    <div class="dashboard-body">
        <!-- 统计卡片 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="s-num" id="statTotal">—</div>
                <div class="s-label">总客户数</div>
            </div>
            <div class="stat-card">
                <div class="s-num" id="statToday">—</div>
                <div class="s-label">今日新增</div>
            </div>
            <div class="stat-card">
                <div class="s-num" id="statPreserved">—</div>
                <div class="s-label">有证据留存</div>
            </div>
            <div class="stat-card">
                <div class="s-num" id="statTopLoss">—</div>
                <div class="s-label">最多损失金额</div>
            </div>
        </div>

        <!-- 控制栏 -->
        <div class="controls-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索姓名、电话、州份、平台..." oninput="applyFilters()">
            <select class="filter-select" id="filterCategory" onchange="applyFilters()">
                <option value="">全部类型</option>
                <option value="Crypto / Digital Asset Investment Fraud">加密货币诈骗</option>
                <option value="Romance Scam / Pig Butchering">杀猪盘 / 情感诈骗</option>
                <option value="Platform Marketplace Non-Settlement Incident">平台交易纠纷</option>
                <option value="Unauthorized Wire Transfer / ACH Fraud">未授权转账</option>
                <option value="Government / Law Enforcement Impersonation">冒充执法机构</option>
                <option value="Other Financial Fraud">其他金融诈骗</option>
            </select>
            <select class="filter-select" id="filterLedger" onchange="applyFilters()">
                <option value="">全部证据状态</option>
                <option value="Preserved">有证据</option>
                <option value="Unpreserved">无证据</option>
            </select>
            <button class="refresh-btn" onclick="manualRefresh()">&#8635; 刷新订单</button>
            <button class="export-btn" onclick="exportCSV()">&#8595; 导出 CSV</button>
        </div>

        <!-- 表格 -->
        <div class="table-wrapper">
            <table id="leadsTable">
                <thead>
                    <tr>
                        <th onclick="sortBy('id')">#</th>
                        <th onclick="sortBy('created_at')">提交时间 &#8597;</th>
                        <th onclick="sortBy('legal_name')">姓名</th>
                        <th onclick="sortBy('whatsapp_terminal')">WhatsApp</th>
                        <th onclick="sortBy('primary_residence')">居住州</th>
                        <th onclick="sortBy('incident_category')">案件类型</th>
                        <th onclick="sortBy('audited_loss')">损失金额</th>
                        <th onclick="sortBy('ledger_status')">证据</th>
                        <th>IP 地址</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="leadsBody">
                    <tr class="loading-row"><td colspan="10"><span class="spinner"></span>加载中...</td></tr>
                </tbody>
            </table>
            <div class="pagination">
                <span id="paginationInfo">加载中...</span>
                <div class="page-btns" id="pageBtns"></div>
            </div>
        </div>
    </div>
</div>

<!-- ==================== 详情弹窗 ==================== -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="modalTitle">客户详情</h2>
            <div class="modal-header-btns">
                <button class="copy-all-btn" id="copyAllBtn" onclick="copyAllInfo()">&#128203; 一键复制全部信息</button>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<!-- 复制成功提示 -->
<div class="toast" id="toast">已复制到剪贴板！</div>

<script>
    // ==========================================
    //  配置
    // ==========================================
    const ADMIN_PASSWORD = 'Aa123456';
    const SUPABASE_URL = 'https://zarqthcmagsmruwqjqml.supabase.co';
    // Service role key — 仅用于后台 admin.html，绝不放在前端 index.html
    const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphcnF0aGNtYWdzbXJ1d3FqcW1sIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDg3MTE2MSwiZXhwIjoyMDk2NDQ3MTYxfQ.3Covj_pt6TNa27OHmeeYuxaH_BjcAuHl_xtcmUlBUWg';

    const PAGE_SIZE = 20;
    let allLeads = [];
    let filteredLeads = [];
    let currentPage = 1;
    let sortField = 'created_at';
    let sortAsc = false;
    let currentLeadForCopy = null;

    // ==========================================
    //  登录 / 退出
    // ==========================================
    function doLogin() {
        const pw = document.getElementById('adminPassword').value;
        if (pw === ADMIN_PASSWORD) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadLeads(true);
        } else {
            document.getElementById('loginError').style.display = 'block';
            document.getElementById('adminPassword').value = '';
        }
    }

    function doLogout() {
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('adminPassword').value = '';
        allLeads = [];
    }

    // ==========================================
    //  手动刷新
    // ==========================================
    function manualRefresh() {
        const btn = document.querySelector('.refresh-btn');
        btn.textContent = '刷新中...';
        btn.disabled = true;
        loadLeads(true).finally(() => {
            btn.innerHTML = '&#8635; 刷新订单';
            btn.disabled = false;
        });
    }

    // ==========================================
    //  从 Supabase 加载数据
    // ==========================================
    async function loadLeads(showLoading = false) {
        if (showLoading) {
            document.getElementById('leadsBody').innerHTML =
                '<tr class="loading-row"><td colspan="10"><span class="spinner"></span>加载中...</td></tr>';
        }
        try {
            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/leads?select=*&order=created_at.desc&limit=1000`,
                {
                    headers: {
                        'apikey': SERVICE_KEY,
                        'Authorization': `Bearer ${SERVICE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                }
            );
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            const prevCount = allLeads.length;
            allLeads = data;
            updateStats();
            applyFilters();
            // 高亮新增行
            if (prevCount > 0 && allLeads.length > prevCount) {
                setTimeout(() => {
                    const rows = document.querySelectorAll('#leadsBody tr');
                    for (let i = 0; i < allLeads.length - prevCount; i++) {
                        if (rows[i]) rows[i].classList.add('new-row');
                    }
                }, 100);
            }
        } catch (e) {
            document.getElementById('leadsBody').innerHTML =
                `<tr class="loading-row"><td colspan="10" style="color:#B91C1C;">加载失败：${e.message}</td></tr>`;
            throw e;
        }
    }

    // ==========================================
    //  统计数据
    // ==========================================
    function updateStats() {
        document.getElementById('statTotal').textContent = allLeads.length;

        const today = new Date().toISOString().slice(0, 10);
        const todayCount = allLeads.filter(l => l.created_at && l.created_at.startsWith(today)).length;
        document.getElementById('statToday').textContent = todayCount;

        const preserved = allLeads.filter(l =>
            l.ledger_status && l.ledger_status.toLowerCase().includes('preserved')
        ).length;
        document.getElementById('statPreserved').textContent = preserved;

        const lossCounts = {};
        allLeads.forEach(l => {
            if (l.audited_loss) lossCounts[l.audited_loss] = (lossCounts[l.audited_loss] || 0) + 1;
        });
        const topLoss = Object.entries(lossCounts).sort((a, b) => b[1] - a[1])[0];
        document.getElementById('statTopLoss').textContent = topLoss ? topLoss[0] : '—';
    }

    // ==========================================
    //  筛选 & 排序
    // ==========================================
    function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const cat = document.getElementById('filterCategory').value;
        const ledger = document.getElementById('filterLedger').value;

        filteredLeads = allLeads.filter(l => {
            const matchSearch = !search ||
                (l.legal_name || '').toLowerCase().includes(search) ||
                (l.whatsapp_terminal || '').toLowerCase().includes(search) ||
                (l.primary_residence || '').toLowerCase().includes(search) ||
                (l.transmitting_channel || '').toLowerCase().includes(search) ||
                (l.incident_category || '').toLowerCase().includes(search);
            const matchCat = !cat || (l.incident_category || '') === cat;
            const matchLedger = !ledger || (l.ledger_status || '') === ledger;
            return matchSearch && matchCat && matchLedger;
        });

        filteredLeads.sort((a, b) => {
            let av = a[sortField] || '';
            let bv = b[sortField] || '';
            if (sortField === 'id') { av = Number(av); bv = Number(bv); }
            if (av < bv) return sortAsc ? -1 : 1;
            if (av > bv) return sortAsc ? 1 : -1;
            return 0;
        });

        currentPage = 1;
        renderTable();
    }

    function sortBy(field) {
        if (sortField === field) sortAsc = !sortAsc;
        else { sortField = field; sortAsc = false; }
        applyFilters();
    }

    // ==========================================
    //  渲染表格
    // ==========================================
    function renderTable() {
        const tbody = document.getElementById('leadsBody');
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageData = filteredLeads.slice(start, start + PAGE_SIZE);

        if (filteredLeads.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#64748B;">暂无客户数据。</td></tr>';
            document.getElementById('paginationInfo').textContent = '共 0 条';
            document.getElementById('pageBtns').innerHTML = '';
            return;
        }

        tbody.innerHTML = pageData.map(lead => {
            const hasEvidence = lead.ledger_status && lead.ledger_status.toLowerCase().includes('preserved');
            return `
            <tr>
                <td style="font-family:monospace;color:#64748B;">${lead.id}</td>
                <td class="truncate" style="font-family:monospace;font-size:12px;">${formatDate(lead.created_at)}</td>
                <td class="truncate"><strong>${esc(lead.legal_name)}</strong></td>
                <td class="truncate" style="font-family:monospace;">${esc(lead.whatsapp_terminal)}</td>
                <td class="truncate">${esc(lead.primary_residence)}</td>
                <td class="truncate" style="font-size:12px;">${esc(lead.incident_category)}</td>
                <td class="truncate" style="font-size:12px;font-weight:600;color:#B91C1C;">${esc(lead.audited_loss)}</td>
                <td><span class="badge ${hasEvidence ? 'badge-yes' : 'badge-no'}">${hasEvidence ? '有' : '无'}</span></td>
                <td class="truncate" style="font-family:monospace;font-size:11px;color:#64748B;">${esc(lead.ip_address || '—')}</td>
                <td><button class="btn-view" onclick="showDetail(${lead.id})">查看详情</button></td>
            </tr>`;
        }).join('');

        // 分页
        const totalPages = Math.ceil(filteredLeads.length / PAGE_SIZE);
        document.getElementById('paginationInfo').textContent =
            `显示第 ${start + 1}–${Math.min(start + PAGE_SIZE, filteredLeads.length)} 条，共 ${filteredLeads.length} 条`;

        let pageBtns = '';
        pageBtns += `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&laquo; 上一页</button>`;
        const maxBtns = 5;
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + maxBtns - 1);
        if (endPage - startPage < maxBtns - 1) startPage = Math.max(1, endPage - maxBtns + 1);
        for (let i = startPage; i <= endPage; i++) {
            pageBtns += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
        }
        pageBtns += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页 &raquo;</button>`;
        document.getElementById('pageBtns').innerHTML = pageBtns;
    }

    function goPage(p) {
        const totalPages = Math.ceil(filteredLeads.length / PAGE_SIZE);
        if (p < 1 || p > totalPages) return;
        currentPage = p;
        renderTable();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ==========================================
    //  详情弹窗
    // ==========================================
    function showDetail(id) {
        const lead = allLeads.find(l => l.id === id);
        if (!lead) return;
        currentLeadForCopy = lead;

        const hasEvidence = lead.ledger_status && lead.ledger_status.toLowerCase().includes('preserved');

        document.getElementById('modalTitle').textContent = `客户 #${lead.id} — ${lead.legal_name || '未知'}`;
        document.getElementById('copyAllBtn').textContent = '📋 一键复制全部信息';
        document.getElementById('copyAllBtn').classList.remove('copied');

        document.getElementById('modalBody').innerHTML = `
            <div class="detail-grid">
                <div class="detail-item">
                    <label>提交时间</label>
                    <div class="val">${formatDateFull(lead.created_at)}</div>
                </div>
                <div class="detail-item">
                    <label>IP 地址</label>
                    <div class="val" style="font-family:monospace;">${esc(lead.ip_address || '—')}</div>
                </div>
                <div class="detail-item">
                    <label>姓名（Legal Name）</label>
                    <div class="val"><strong>${esc(lead.legal_name)}</strong></div>
                </div>
                <div class="detail-item">
                    <label>WhatsApp 电话</label>
                    <div class="val" style="font-family:monospace;">${esc(lead.whatsapp_terminal)}</div>
                </div>
                <div class="detail-item">
                    <label>性别（Gender）</label>
                    <div class="val">${esc(lead.biological_gender || '—')}</div>
                </div>
                <div class="detail-item">
                    <label>年龄（Age）</label>
                    <div class="val">${esc(lead.verified_age || '—')}</div>
                </div>
                <div class="detail-item">
                    <label>居住州（State）</label>
                    <div class="val">${esc(lead.primary_residence)}</div>
                </div>
                <div class="detail-item">
                    <label>案件类型（Incident Category）</label>
                    <div class="val">${esc(lead.incident_category)}</div>
                </div>
                <div class="detail-item">
                    <label>损失金额（Loss Amount）</label>
                    <div class="val" style="font-weight:700;color:#B91C1C;font-size:16px;">${esc(lead.audited_loss)}</div>
                </div>
                <div class="detail-item">
                    <label>诈骗平台（Platform）</label>
                    <div class="val">${esc(lead.transmitting_channel)}</div>
                </div>
                <div class="detail-item">
                    <label>证据留存（Evidence）</label>
                    <div class="val"><span class="badge ${hasEvidence ? 'badge-yes' : 'badge-no'}">${esc(lead.ledger_status)}</span></div>
                </div>
                <div class="detail-item">
                    <label>数字签名（Signature）</label>
                    <div class="val" style="font-style:italic;">"${esc(lead.digital_signature)}"</div>
                </div>
                <div class="detail-item full">
                    <label>案情描述（Event Chronology）</label>
                    <div class="val narrative">${esc(lead.event_chronology)}</div>
                </div>
                <div class="detail-item full">
                    <label>浏览器信息（User Agent）</label>
                    <div class="val" style="font-size:11px;color:#64748B;font-family:monospace;word-break:break-all;">${esc(lead.user_agent || '—')}</div>
                </div>
            </div>
        `;
        document.getElementById('detailModal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('detailModal').classList.remove('open');
        currentLeadForCopy = null;
    }
    document.getElementById('detailModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // ==========================================
    //  一键复制全部信息
    // ==========================================
    function copyAllInfo() {
        const lead = currentLeadForCopy;
        if (!lead) return;

        const text = [
            `【客户信息 #${lead.id}】`,
            `提交时间：${formatDateFull(lead.created_at)}`,
            ``,
            `── 个人信息 ──`,
            `姓名：${lead.legal_name || '—'}`,
            `性别：${lead.biological_gender || '—'}`,
            `年龄：${lead.verified_age || '—'}`,
            `居住州：${lead.primary_residence || '—'}`,
            `WhatsApp：${lead.whatsapp_terminal || '—'}`,
            ``,
            `── 案件信息 ──`,
            `案件类型：${lead.incident_category || '—'}`,
            `损失金额：${lead.audited_loss || '—'}`,
            `诈骗平台：${lead.transmitting_channel || '—'}`,
            `证据留存：${lead.ledger_status || '—'}`,
            `数字签名：${lead.digital_signature || '—'}`,
            ``,
            `── 案情描述 ──`,
            `${lead.event_chronology || '—'}`,
            ``,
            `── 技术信息 ──`,
            `IP 地址：${lead.ip_address || '—'}`,
        ].join('\n');

        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyAllBtn');
            btn.textContent = '✅ 已复制！';
            btn.classList.add('copied');
            showToast('已复制到剪贴板！');
            setTimeout(() => {
                btn.textContent = '📋 一键复制全部信息';
                btn.classList.remove('copied');
            }, 3000);
        }).catch(() => {
            // 降级方案
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('已复制到剪贴板！');
        });
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ==========================================
    //  导出 CSV
    // ==========================================
    function exportCSV() {
        const headers = ['编号', '提交时间', '姓名', 'WhatsApp', '性别', '年龄', '居住州', '案件类型', '损失金额', '诈骗平台', '证据', '数字签名', '案情描述', 'IP地址'];
        const rows = filteredLeads.map(l => [
            l.id,
            formatDateFull(l.created_at),
            l.legal_name,
            l.whatsapp_terminal,
            l.biological_gender,
            l.verified_age,
            l.primary_residence,
            l.incident_category,
            l.audited_loss,
            l.transmitting_channel,
            l.ledger_status,
            l.digital_signature,
            (l.event_chronology || '').replace(/\n/g, ' '),
            l.ip_address
        ].map(v => `"${String(v || '').replace(/"/g, '""')}"`));

        const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `us-客户信息-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // ==========================================
    //  工具函数
    // ==========================================
    function esc(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return d.toLocaleDateString('zh-CN', { year: '2-digit', month: '2-digit', day: '2-digit' }) +
               ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function formatDateFull(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return d.toLocaleString('zh-CN', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hour12: false
        });
    }
</script>
